# bump2version is the only way the version changes (REPO_CONTRACT §5.2): it
# rewrites every file below, commits, and tags in one step, so the bump *is*
# the release-cut action. Never bump early.
#
# This lives in .bumpversion.cfg rather than setup.cfg so the release
# machinery is in one obvious file and does not have to be found inside
# packaging config.

[bumpversion]
current_version = 1.4.3
commit = True
tag = True
tag_name = v{new_version}
message = Bump version: {current_version} → {new_version}

# RiboMetric/__init__.py is the single source of truth for the running
# package: setup.py reads __version__ out of it. The files below carry their
# own copies of the version for packaging and citation metadata, so
# bump2version rewrites them in the same commit rather than leaving them to be
# hand-edited -- which is how conda-ribometric/meta.yaml drifted to 0.1.9
# while PyPI shipped 1.4.3.
[bumpversion:file:RiboMetric/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:pixi.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

# A citation record with the wrong version is a correctness bug, not
# cosmetics. `date-released` is NOT bumped automatically (bump2version has no
# date support); update it with the changelog when cutting a release.
[bumpversion:file:CITATION.cff]
search = version: {current_version}
replace = version: {new_version}

# The conda recipe also needs a fresh source sha256, which cannot be derived
# from the version: refresh it from the published sdist after the PyPI upload
# completes.
[bumpversion:file:conda-ribometric/meta.yaml]
# NB: the braces are doubled because bump2version runs the value through
# str.format. Unlike setup.cfg, .bumpversion.cfg is read without configparser
# interpolation, so a literal % is written once here, not as %%.
search = {{% set version = "{current_version}" %}}
replace = {{% set version = "{new_version}" %}}
