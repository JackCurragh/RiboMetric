argument:
  # Arguments, config values are overwritten when called in the command-line
  bam: null                   # Filepath for bam
  annotation: null            # Filepath for annotation
  gff: null                   # Filepath for gff
  fasta: null                 # Filepath for fasta
  json_in: null               # Filepath for JSON input
  json_config: False          # Use JSON config instead of this config for generating plots
  name: null                  # Sets the name for the reports and/or data output, when set to None, uses bam filename
  output: "."                 # Sets the output directory for the reports and/or data output
  threads: 8                  # Number of threads used by RiboMetric
  subsample: null             # Number of reads processed from the bam file, null being the entire file
  transcripts: null           # Number of transcripts processed from a gff file, null being the entire file
  html: True                  # Output HTML report
  pdf: False                  # Output PDF report
  json: False                 # Output results as JSON
  csv: False                  # Output metrics as CSV
  offset_calculation_method: "ribowaltz"
  offset_target: "a_site"     # Site represented by calculated offsets: "a_site" or "p_site"
  offset_min: 8               # Minimum plausible final offset from the read 5' end
  offset_max: 20              # Maximum plausible final offset from the read 5' end
  offset_max_read_length_fraction: 0.6667  # Relative ceiling; 27nt reads cap at 18
  # Filter reads used for frame-sensitive calculations (offset detection and
  # periodicity).  "unique_only" restricts those calculations to reads with
  # MAPQ=255, which in STAR output means exactly one genomic mapping locus.
  # Isoform-level duplicates (same locus, different transcripts) are already
  # collapsed to one primary alignment by the -F 256 filter applied during BAM
  # splitting, so this setting removes genuine genomic multimappers without
  # discarding isoform-equivalent reads.  Set to "none" to use all primary
  # reads (pre-0.1.16 behaviour).
  multimap_filter: "unique_only"

plots:
  # Controls general plot theming and specific plot options
  font_family: Helvetica Neue,Helvetica,Arial,sans-serif
  base_color: '#7f7f7f'
  nucleotide_colors: {"A": "#c93434", "C": "#2e85db", "G": "#f0de1f", "T": "#1fc24d"}
  image_size: [720, 370]      # [Width, Height] in pixels, used for pdf images
  terminal_nucleotide_bias_distribution:
    nucleotide_count: 2       # Size of nucleotide groups to check (default = 2)
    target: "both"            # Options: ["five_prime", "three-prime", "both"]
    include_N: False          # Show nucleotide groups with N in plot
    background_freq: True     # Use background frequency of nucleotide groups in reads to check ligation bias
  nucleotide_proportion:
    nucleotide_start: 0
    nucleotide_count: 15
  read_frame_distribution:
    upper_limit: 40
    lower_limit: 15
    show_scores: "all"        # Options: ["all", "global", "none"]
  mRNA_distribution:
    upper_limit: 50
    lower_limit: 10
    absolute_counts: False    # Options for both?
  mRNA_read_breakdown:
    upper_limit: 50
    lower_limit: 10
    absolute_counts: False
    plotting_order: ['five_leader', 'start_codon', 'CDS', 'stop_codon', 'three_trailer']
  metagene_profile:
    distance_target: "both"   # Options: ["start", "stop", "both"]
    shared_yaxis: False       # For the metagene profile barplot, controls whether the start and stop distance share a y-axis or not
    distance_range: [-50,50]  # Set the max distance to count reads from the target(s)
    colorscale: "blues"    # Heatmap colorscale, see https://plotly.com/python/builtin-colorscales/
    max_colorscale: null      # if set to null, the plot will generate with relative counts (0 to 1)
  exclude_metrics: ['ratio_leader:trailer_global', 'prop_reads_leader_global', 'prop_reads_trailer_global']
    
qc:
  use_cds_subset:
  # Defines which modules use only reads that are on cds
  # If False, uses all reads
    read_frame_distribution: True
  read_frame_distribution:
    3nt_count_cutoff: 0.05
    exclude_codons: 9          # Exclude this many nt around CDS start/stop (triplet boundary noise). 9 = 3 codons
    # Optional selection of read lengths contributing to global periodicity metrics
    # periodicity_top_n: 5        # Keep top-N read lengths by mass (commented = disabled)
    # periodicity_mass_threshold: 0.8  # Keep minimal set of lengths covering this fraction of reads (disabled by default)
    # psite_min_prominence: 1.5   # Minimum peak/median ratio to accept a P-site offset (fallback to consensus otherwise)
    offset_frame_correction_min_reads: 50      # Min unique CDS reads to nudge a non-zero dominant frame back to frame 0
    offset_frame_correction_min_fraction: 0.6  # Dominant-frame fraction required before nudging an offset by +/-1 nt
  cds_coverage:
    in_frame_coverage: True   # Only check in-frame coverage, otherwise check complete cds coverage
  disome:
    # Read-length window (nt) used for the di-some proportion metric. Defaults
    # suit mammalian di-somes (~2x monosome footprint); widen/shift for other
    # organisms or nucleases.
    lower_limit: 50
    upper_limit: 70
  recommend:
    # Thresholds for recommending which read lengths to keep for downstream
    # P-site assignment / ORF calling. A read length is recommended when its
    # dominant-frame fraction is >= min_periodicity and it carries at least
    # min_read_proportion of all reads. Override min_periodicity on the CLI
    # with --min-periodicity.
    min_periodicity: 0.5
    min_read_proportion: 0.05
  floss:
    # FLOSS-style read-length heterogeneity. Transcripts with fewer than
    # min_reads_per_transcript reads are skipped; a transcript is "aberrant"
    # when its FLOSS exceeds cutoff.
    min_reads_per_transcript: 20
    cutoff: 0.3
  codon_dwell:
    # Nucleotides trimmed from each CDS end before computing A-site codon
    # dwell-times, to exclude initiation/termination peaks (requires --fasta).
    elongation_5_nt: 15
    elongation_3_nt: 15

metrics:
  # Control which metrics are calculated
  # Default metrics are the standard Ribo-Seq QC metrics expected by users
  # Optional metrics are more theoretical/experimental approaches

  # DEFAULT METRICS (always calculated)
  default:
    # Read length distribution
    - read_length_distribution_IQR
    - read_length_distribution_coefficient_of_variation
    - read_length_distribution_maxprop

    # Di-some detection (bimodality + 50-70 nt fraction)
    - read_length_distribution_bimodality
    - disome_proportion

    # Terminal nucleotide bias
    - terminal_nucleotide_bias_KL_5prime
    - terminal_nucleotide_bias_KL_3prime
    - terminal_nucleotide_bias_max_absolute_5prime
    - terminal_nucleotide_bias_max_absolute_3prime

    # Periodicity - frame dominance is the standard metric
    - periodicity_dominance
    - periodicity_information  # Information content approach

    # Uniformity - entropy is interpretable and standard
    - uniformity_entropy

    # Coverage and regional distribution
    - CDS_coverage
    - region_ratios
    - region_proportions

    # Alignment quality metrics
    - duplicate_rate
    - multimapper_rate
    - rpf_multimapper_rate
    - unique_rpf_rate
    - alignment_multimapper_rate
    - soft_clip_rate_5prime

    # Codon-level translation metrics (requires annotation)
    - stop_codon_readthrough_ratio
    - start_codon_enrichment_ratio

  # OPTIONAL METRICS (only calculated if enabled via --enable-optional-metrics or --enable-metric)
  optional:
    # Enable to build P-site aligned metagene for spectral metrics
    - periodicity_psite_aligned
    # Additional read length metrics
    - read_length_distribution_normality

    # RUST codon-level metagene (requires --fasta)
    - rust_mean_kl_divergence

    # Alternative periodicity metrics (more theoretical)
    - periodicity_autocorrelation
    - periodicity_fourier
    - periodicity_trips_viz

    # Alternative uniformity metrics (more theoretical)
    - uniformity_autocorrelation
    - uniformity_theil_index
    - uniformity_gini_index
    # Spectral metrics can optionally use P-site aligned metagenes
    # (controlled by qc.periodicity.use_psite_aligned below)
    # - periodicity_autocorr_psite
    # - periodicity_fourier_psite

periodicity:
  use_psite_aligned: true  # When available, use P-site aligned metagene for autocorr/Fourier

# Commented out metrics here will not appear in the summary scores plot
max_mins: # max mins from simulations for each metric github.com/JackCurragh/MetricAnalysis
  # periodicity_autocorrelation: [0, 4.552344]
  periodicity_fourier: [0, 1]
  # periodicity_information: [0, 0.913217]
  # periodicity_information_weighted: [0, 0.913217]
  # periodicity_trips-viz: [0, 1]
  periodicity_dominance: [0, 1]
  # uniformity_autocorrelation: [0, 1]
  uniformity_entropy: [0, 1]
  # uniformity_theil_index: [0, 45]
  # uniformity_gini_index: [0, 1]
  prop_reads_CDS: [0, 1]
  prop_reads_leader: [0, 1]
  prop_reads_trailer: [0, 1]
  # Legacy bias metric names (kept for compatibility)
  terminal_nucleotide_bias_distribution_5_prime: [0, 1]
  terminal_nucleotide_bias_distribution_3_prime: [0, 1]
  # Consolidated bias metric names
  terminal_bias_kl_5prime: [0, 1]
  terminal_bias_kl_3prime: [0, 1]
  terminal_bias_kl_5prime_score: [0, 1]
  terminal_bias_kl_3prime_score: [0, 1]
  # Raw KL divergence keys are intentionally not normalized here.
  # terminal_bias_kl_5prime_raw: [0, 1]
  # terminal_bias_kl_3prime_raw: [0, 1]
  # Optional: max-abs bias consolidated names
  terminal_bias_maxabs_5prime: [0, 1]
  terminal_bias_maxabs_3prime: [0, 1]
  # Consolidated CDS coverage key
  cds_coverage: [0, 1]
  CDS_coverage: [0, 1]
  CDS_coverage_metric: [0, 1]
  cds_coverage_not_inframe_1read_1000tx: [0, 1]
  CDS_coverage_metric_not_inframe_1read_1000tx: [0, 1]
  cds_coverage_not_inframe_100read_100tx: [0, 1]
  CDS_coverage_metric_not_inframe_100read_100tx: [0, 1]
  cds_coverage_inframe_1read_1000tx: [0, 1]
  CDS_coverage_metric_inframe_1read_1000tx: [0, 1]
  cds_coverage_inframe_100read_100tx: [0, 1]
  CDS_coverage_metric_inframe_100read_100tx: [0, 1]
  # terminal_nucleotide_bias_max_absolute_metric_5_prime: [0, 1]
  # terminal_nucleotide_bias_max_absolute_metric_3_prime: [0, 1]
  read_length_distribution_IQR: [0, 1]
  read_length_distribution_coefficient_of_variation: [0, 1]
  read_length_distribution_maxprop: [0, 1]
  read_length_distribution_bimodality: [0, 1]
  read_length_distribution_normality: [0, 1]
  terminal_nucleotide_bias_max_absolute_5_prime: [0, 1]
  terminal_nucleotide_bias_max_absolute_3_prime: [0, 1]
  periodicity_information: [0, 1]
  periodicity_information_weighted_score: [0, 1]
  periodicity_trips-viz: [0, 1]
  uniformity_theil_index: [0, 1]
  uniformity_gini_index: [0, 1]
  disome_proportion: [0, 1]
  recommended_read_proportion: [0, 1]
  duplicate_rate: [0, 1]
  multimapper_rate: [0, 1]
  rpf_multimapper_rate: [0, 1]
  unique_rpf_rate: [0, 1]
  alignment_multimapper_rate: [0, 1]
  soft_clip_rate_5prime: [0, 1]
  stop_codon_readthrough_ratio: [0, 5]
  start_codon_enrichment_ratio: [0, 20]
  # rust_mean_kl_divergence: [0, 1]

# Unified scoring (see docs/METRICS_DESIGN.md). Single source of truth for how
# raw metrics become anchored 0-1, higher-is-better scores and PASS/WARNING/
# FAIL statuses. Used by the summary cards, the per-metric badges, and the QC
# gate. Code defaults live in scoring.py (DEFAULT_SCORING); entries here are
# merged over those defaults per metric, so you can override status thresholds
# or gate membership without code changes.
#   method   : identity | one_minus_rate | frame_dominance_rescaled |
#              inverse_linear | enrichment_ratio
#   status   : score thresholds {pass, warn}
#   gate     : true => counts toward the overall QC verdict (Tier-1 only)
#   tier     : 1 identity | 2 usability | 3 technical caveat
# Phase 1A/1B metrics only; CDS enrichment (1C) and terminal-bias (1D) are
# added here when those phases land.
scoring:
  # Tier 1 - is this Ribo-seq-like? (gated)
  periodicity_dominance:
    method: identity
    status: {pass: 0.70, warn: 0.50}
    gate: true
    tier: 1
  periodicity_information:
    method: identity
    status: {pass: 0.60, warn: 0.30}
    gate: true
    tier: 1
  cds_enrichment_ratio:
    method: enrichment_ratio
    status: {pass: 0.60, warn: 0.30}
    gate: true
    tier: 1
  # Tier 2 - usable for my analysis? (not gated)
  recommended_read_proportion:
    method: identity
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 2
  uniformity_entropy:
    method: identity
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 2
  marginal_position_discovery_rate:
    method: one_minus_rate
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 2
  # Tier 3 - technical caveats (not gated)
  duplicate_rate:
    method: one_minus_rate
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 3
  rpf_multimapper_rate:
    method: one_minus_rate
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 3
  multimapper_rate:
    method: one_minus_rate
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 3
  alignment_multimapper_rate:
    method: one_minus_rate
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 3
  unique_rpf_rate:
    method: identity
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 3
  soft_clip_rate_5prime:
    method: one_minus_rate
    status: {pass: 0.60, warn: 0.30}
    gate: false
    tier: 3
  # Terminal bias (S4): scored via raw KL bits; 1/(1+KL) _score variants retired
  terminal_bias_kl_5prime_raw:
    method: inverse_linear
    params: {max_value: 2.0}
    status: {pass: 0.70, warn: 0.40}
    gate: false
    tier: 3
  terminal_bias_kl_3prime_raw:
    method: inverse_linear
    params: {max_value: 2.0}
    status: {pass: 0.70, warn: 0.40}
    gate: false
    tier: 3
  terminal_bias_maxabs_5prime:
    method: one_minus_rate
    status: {pass: 0.70, warn: 0.40}
    gate: false
    tier: 3
  terminal_bias_maxabs_3prime:
    method: one_minus_rate
    status: {pass: 0.70, warn: 0.40}
    gate: false
    tier: 3
