name: CI

# THE gate. Every check the project enforces is defined here, exactly once.
#
# It runs on its own for pushes and PRs, and is *called* by release.yml
# (`workflow_call`) so a tagged release re-runs the identical gate rather than
# a drifting copy of it. A job added here is automatically enforced at release
# time; there is no second place to update.
#
# The `image` job publishes the moving `:main` / `:sha-<short>` container tags
# and is gated on lint+test. Release tags (`:vX.Y.Z`, `:X.Y`, `:latest`) are
# published by release.yml instead.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # Fatal, and installed pinned rather than `|| true`. This step was
      # commented out for long enough that the codebase accumulated unused
      # imports, mid-file imports and a duplicated import nobody saw. A gate
      # that exists but is not run is worse than no gate.
      - name: Install linters
        run: python -m pip install --upgrade pip 'ruff>=0.6' 'black>=24.0'
      - name: ruff
        run: ruff check RiboMetric tests
      - name: black
        run: black --check RiboMetric tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools libbz2-dev zlib1g-dev liblzma-dev libcurl4-openssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip mypy types-PyYAML
          pip install -r requirements.txt

      # Fatal. No `|| true`: fix the types rather than downgrading the gate.
      - name: mypy
        run: mypy --config-file mypy.ini RiboMetric

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the highest supported version
        # (`python_requires = ">=3.10,<3.13"` in setup.py).
        python-version: ['3.10', '3.12']
    env:
      RIBOMETRIC_SKIP_IMAGES: "1"
      RIBOMETRIC_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools libbz2-dev zlib1g-dev liblzma-dev libcurl4-openssl-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest -q -n auto

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest -n auto --cov=RiboMetric --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # `twine check` alone does NOT catch a non-normalised wheel filename.
      # PyPI rejects it with a 400 at upload, after a fully green build, and
      # the message reads like an auth problem -- this silently killed three
      # TranslonScorer releases. setup.py declares `name="ribometric"`, so the
      # filenames are normalised at the source; this asserts it stays that way
      # regardless of which setuptools the runner resolves.
      - name: Check metadata and wheel filename normalisation
        run: |
          set -euo pipefail
          twine check dist/*
          for f in dist/*.whl dist/*.tar.gz; do
            base="$(basename "$f")"
            case "$base" in
              ribometric-*) ;;
              *) echo "::error::$base is not normalised; PyPI requires the 'ribometric-' prefix (check name= in setup.py)"; exit 1 ;;
            esac
          done
          echo "dist filenames normalised:"; ls -1 dist

      # release.yml publishes this exact artifact, so the shipped bits are the
      # checked bits rather than a rebuild that might differ.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    name: Publish :main container
    # Moving tags for the tip of main only. Release tags come from release.yml,
    # which is the sole owner of `:latest`. Gated on lint+test so a broken tree
    # cannot reach the registry -- the old build-container.yml fired on
    # `tags: '*'` with no gate at all and raced release.yml for the same image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name (GHCR requires lowercase)
        id: img
        # github.repository_owner preserves the account's casing
        # ("JackCurragh") and GitHub expressions have no lower() function.
        # docker/metadata-action lowercases its own tag outputs, so the push
        # works either way -- but the raw `docker run <name>@<digest>` in the
        # smoke test does not, and fails with "repository name must be
        # lowercase". Lowercase it once, here.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ribometric" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile's CMD is a shell, not the entrypoint, so the command
      # has to be named explicitly.
      - name: Smoke test built image
        run: docker run --rm "${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}" RiboMetric --help
