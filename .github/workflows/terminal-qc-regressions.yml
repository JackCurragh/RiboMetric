name: Terminal bias and required QC regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.10,<2' 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Run focused source tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q -o addopts=
          tests/test_terminal_kl_support.py
          tests/test_terminal_kl_serialization.py
          tests/test_terminal_kl_report_gate.py
          tests/test_required_qc_evidence.py
          tests/test_evaluate_required_evidence.py
          tests/test_summary_column_integrity.py
