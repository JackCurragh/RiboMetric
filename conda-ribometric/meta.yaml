{% set name = "ribometric" %}
{% set version = "1.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # PyPI normalises sdist filenames, so the artefact is ribometric-X.Y.Z.tar.gz
  # even though the project is registered as RiboMetric.
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7602556f518a66015b4b15a463995c0c2ef2eda13d040b5b1ff8934f9f02b7ab

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - RiboMetric = RiboMetric.cli:main
    - ribometric = RiboMetric.cli:main

requirements:
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools
  run:
    # Kept in step with install_requires in setup.py.
    - python >=3.10,<3.13
    - biopython >=1.81
    - gffpandas >=1.2.0
    - jinja2 >=3.0
    - python-kaleido >=1.0.0
    - numpy >=1.24,<2
    - oxbow >=0.3.0
    - pandas >=2.0,<2.3
    - plotly >=5.14
    - pyarrow >=10.0.0
    - pysam >=0.21.0
    - pyyaml >=6.0
    - rich >=13.3.3
    - scipy >=1.10
    - textual >=0.47.0

test:
  imports:
    # The importable package is RiboMetric; the conda package name is lowercase.
    - RiboMetric
  commands:
    - RiboMetric --help
    - ribometric --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/JackCurragh/RiboMetric
  summary: A python command-line utility for the generation of comprehensive reports on the quality of ribosome profiling (Ribo-Seq) datasets
  license: MIT
  license_file: LICENSE
  doc_url: https://ribometric.readthedocs.io

extra:
  recipe-maintainers:
    - JackCurragh
