{% set name = "RiboMetric" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d1a7f12844733b250539c4a402cc4406b07f76f9a6033f92a17a5dc3896a498f

build:
  skip: true  # [py<310 or py>=313]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - RiboMetric = RiboMetric.cli:main
    - ribometric = RiboMetric.cli:main

requirements:
  host:
    - python
    - pip
    - setuptools >=64
  run:
    - python >=3.10,<3.13
    - biopython >=1.81
    - gffpandas >=1.2.0
    - jinja2 >=3.0
    - kaleido >=1.0.0
    - numpy >=1.24,<2
    - oxbow >=0.3.0
    - pandas >=2.0,<2.3
    - plotly >=5.14
    - pyarrow >=10.0.0
    - pysam >=0.21.0
    - pyyaml >=6.0
    - rich >=13.3.3
    - scipy >=1.10
    - textual >=0.47.0

test:
  imports:
    - ribometric
  commands:
    - ribometric --help
    - RiboMetric --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/JackCurragh/RiboMetric
  summary: >-
    A command-line utility for comprehensive quality assessment of
    ribosome profiling (Ribo-Seq) datasets
  description: |
    RiboMetric analyses ribosome profiling BAM files to produce HTML/JSON
    quality reports covering read-length distribution, P-site periodicity,
    metagene profiles, terminal-bias, and more.  It includes an
    ``evaluate`` subcommand for automated QC gating in Nextflow/Snakemake
    pipelines.
  license: MIT
  license_file: LICENSE
  doc_url: https://ribometric.readthedocs.io
  dev_url: https://github.com/JackCurragh/RiboMetric

extra:
  recipe-maintainers:
    - JackCurragh
