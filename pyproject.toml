[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# Packaging metadata lives in setup.py, which reads the single source of truth
# for the version out of RiboMetric/__init__.py. Only tool configuration is
# here.

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(build|dist|docs)/"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "docs"]

[tool.ruff.lint]
# ruff replaces flake8 *and* isort (REPO_CONTRACT §4b) -- do not add either
# back. Formatting (line length etc.) is black's job; ruff handles correctness
# and import order. E501 is off because black wraps; F catches unused imports
# and undefined names.
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]
