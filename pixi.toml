[workspace]
authors = ["Jack Tierney <jackcurragh@gmail.com>"]
channels = ["conda-forge"]
name = "RiboMetric"
platforms = ["osx-arm64"]
version = "1.4.3"

[tasks]
ribometric = "RiboMetric"
test = "pytest -q"
test-cov = "pytest --cov=RiboMetric --cov-report=term-missing"
lint = "ruff check RiboMetric tests && black --check RiboMetric tests"
typecheck = "mypy --config-file mypy.ini RiboMetric"

[dependencies]
# Align with setup.py and CI (3.10–3.12)
python = ">=3.10,<3.13"

[pypi-dependencies]
build = ">=1.3.0, <2"
twine = ">=6.2.0, <7"
textual = ">=0.47.0"
# Editable install with dev extras pulls pytest/coverage/ruff/black/mypy into the
# pixi env so `pixi run test` does not fall through to a system pytest.
ribometric = { path = ".", editable = true, extras = ["dev"] }
