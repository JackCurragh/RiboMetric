[bumpversion]
current_version = 1.4.3
commit = True
tag = True

# RiboMetric/__init__.py is the single source of truth for the running package:
# setup.py reads __version__ out of it. The files below carry their own copies
# of the version for packaging and citation metadata, so bump2version rewrites
# them in the same commit rather than leaving them to be hand-edited (which is
# how conda-ribometric/meta.yaml drifted to 0.1.9 while PyPI shipped 1.4.3).
[bumpversion:file:RiboMetric/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:pixi.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:CITATION.cff]
search = version: {current_version}
replace = version: {new_version}

# The conda recipe also needs a fresh source sha256, which cannot be derived
# from the version: refresh it from the published sdist after the PyPI upload
# completes. See RELEASE.md.
[bumpversion:file:conda-ribometric/meta.yaml]
# NB: bump2version reads setup.cfg with configparser's BasicInterpolation, so a
# literal % must be written %%; the braces are doubled for str.format.
search = {{%% set version = "{current_version}" %%}}
replace = {{%% set version = "{new_version}" %%}}
