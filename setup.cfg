[bumpversion]
current_version = 1.2.0
commit = True
tag = True

# Version lives only in RiboMetric/__init__.py; setup.py reads it from there.
[bumpversion:file:RiboMetric/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[flake8]
exclude = docs
extend-ignore =
    E125,
    E128,
    E303,
    E305,
    E402,
    E501,
    E741,
    W291,
    W292,
    W293,
    W391
