# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# `build:` is required on config v2. Without it the build fails before Sphinx
# runs. The old `python.version` key this file used was removed from the schema
# some years ago -- the interpreter is selected here, under build.tools.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Fatal, and it is meant to stay that way. The build reached zero warnings on
  # 2026-09-07; a docs build that tolerates warnings rots exactly the way a
  # commented-out lint gate does. `make docs-strict` runs the same check.
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
